<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Campus Request System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Campus Request System</h1>

        <p>
            Submit your campus-related problem or request
        </p>


        <!-- Request Form -->

        <form id="requestForm">

            <input
                type="text"
                id="studentName"
                placeholder="Student Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <select id="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Hostel">
                    Hostel
                </option>

                <option value="Academic">
                    Academic
                </option>

                <option value="Transport">
                    Transport
                </option>

                <option value="Library">
                    Library
                </option>

                <option value="Infrastructure">
                    Infrastructure
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <textarea
                id="description"
                placeholder="Describe your problem or request"
                required
            ></textarea>


            <select id="priority" required>

                <option value="">
                    Select Priority
                </option>

                <option value="Low">
                    Low
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="High">
                    High
                </option>

            </select>


            <button type="submit">
                Submit Request
            </button>

        </form>


        <!-- Display Requests -->

        <h2>Submitted Requests</h2>

        <div id="requestsContainer"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
